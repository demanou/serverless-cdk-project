name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run build

      - name: Unit tests (CDK stack + Lambda handler)
        run: npm test

      - name: Synthesize CloudFormation template
        run: npx cdk synth -q
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: ca-central-1
